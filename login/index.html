<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Klik Madura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D4262C;
    --green:#0F6B3A;
    --cream:#FFFBF2;
    --ink:#1E1B16;
    --line:#EDE6D6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.55;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{font-family:'Baloo 2', sans-serif;}
  a{text-decoration:none; color:inherit;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;}
  .logo img{height:50px; width:auto; display:block;}

  .login-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }

  .login-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px;
    max-width:420px;
    width:100%;
    box-shadow:0 4px 6px rgba(0,0,0,0.05);
  }

  .login-box h1{
    font-size:28px;
    margin-bottom:8px;
    text-align:center;
  }

  .login-box .subtitle{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:32px;
  }

  .form-group{
    margin-bottom:20px;
  }

  .form-group label{
    display:block;
    font-weight:600;
    font-size:14px;
    margin-bottom:8px;
  }

  .form-group input{
    width:100%;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
  }

  .form-group input:focus{
    outline:none;
    border-color:var(--red);
  }

  .btn-login{
    width:100%;
    padding:14px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    font-family:inherit;
  }

  .btn-login:hover{
    background:#b81f24;
  }

  .btn-login:disabled{
    background:#ccc;
    cursor:not-allowed;
  }

  .divider{
    text-align:center;
    margin:24px 0;
    color:#999;
    font-size:13px;
  }

  .register-link{
    text-align:center;
    font-size:14px;
  }

  .register-link a{
    color:var(--red);
    font-weight:600;
  }

  .alert{
    padding:12px 16px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
  }

  .alert-error{
    background:#ffe6e6;
    color:#d32f2f;
    border:1px solid #ffcccc;
  }

  .alert-success{
    background:#e6f4ea;
    color:#0f6b3a;
    border:1px solid #b7e4c7;
  }

  .demo-credentials{
    background:#f5f5f5;
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
    font-size:13px;
  }

  .demo-credentials h4{
    font-size:14px;
    margin-bottom:8px;
    color:var(--red);
  }

  .demo-credentials code{
    background:#fff;
    padding:2px 6px;
    border-radius:4px;
    font-family:'Courier New', monospace;
  }

  footer{
    text-align:center;
    padding:20px 24px;
    font-size:13px;
    color:#999;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      <img src="../img/logo_klik_madura_v3_biru.svg" alt="Klik Madura">
      Klik Madura
    </a>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h1>Masuk</h1>
      <p class="subtitle">Belanja lebih mudah dengan akun Klik Madura</p>

      <div id="alertBox"></div>

      <div class="demo-credentials">
        <h4>🔐 Demo Credentials</h4>
        <p><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Masuk</button>
      </form>

      <div class="divider">atau</div>

      <div class="register-link">
        Belum punya akun? <a href="/register">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Klik Madura
  </footer>

  <script src="../js/cart.js"></script>
  <script src="../js/transactions.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || '/produk';
      window.location.href = redirect;
    }

    // Handle login form
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      
      if (!username || !password) {
        alertBox.innerHTML = '<div class="alert alert-error">Username dan password harus diisi.</div>';
        return;
      }
      
      const result = login(username, password);
      
      if (result.success) {
        alertBox.innerHTML = '<div class="alert alert-success">' + result.message + '</div>';
        
        // Sync cart for this user
        syncUserCart(result.user.id);
        
        // Redirect after short delay
        setTimeout(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/produk';
          window.location.href = redirect;
        }, 500);
      } else {
        alertBox.innerHTML = '<div class="alert alert-error">' + result.message + '</div>';
      }
    });
  </script>
</body>
</html>
